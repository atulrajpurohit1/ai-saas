# Port 80: the ACME challenge, and a redirect for everything else.
#
# This file is always mounted, including before any certificate exists, which
# is what makes the first `certbot certonly --webroot` possible. The TLS server
# lives in a separate file so nginx can start without a certificate -- see
# 10-dashboard-tls.conf.disabled.

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.aegislead.co;

    # Must stay reachable over plain HTTP: Let's Encrypt follows redirects for
    # the challenge, but renewal is simpler and less fragile served directly.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Anything arriving on 80 for another name (a stray DNS record, a scanner
# hitting the bare IP) gets a flat refusal rather than the dashboard.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
