# Build and test both apps.
#
# Runs on every push and pull request, and is also called by
# deploy-production.yml via workflow_call so a production deploy cannot skip
# it. That is the reason this is a reusable workflow rather than duplicated
# steps: there is exactly one definition of "green".
#
# NOT GATED ON LINT, deliberately. `npx eslint` currently reports 2088 problems
# in backend/ (overwhelmingly prettier CRLF-vs-LF noise from Windows checkouts)
# and 1 error in frontend/. Gating on that would block every deploy from day
# one, and a job that is always red teaches people to ignore it. Worth fixing
# as its own piece of work, after which a lint job belongs here.

name: CI

on:
  push:
    # `production` is deliberately absent: deploy-production.yml calls this
    # workflow itself, so listing it here would run the whole suite twice on
    # the same commit AND make the deploy queue behind its own duplicate
    # (both runs share the concurrency group below).
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A superseded run tells you nothing useful, so let a newer push cancel it --
# except on production, where deploy-production.yml serialises instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      # `npm run build` is `prisma generate && nest build`. Generation has to
      # happen before compilation: the generated client supplies the types the
      # rest of the code is checked against.
      - name: Build
        working-directory: backend
        run: npm run build

      # The suite needs no database -- every spec mocks PrismaService -- so no
      # service container is required. The specs that exercise the
      # environment check log ERROR lines about unset DATABASE_URL on purpose;
      # that is asserted output, not a failure.
      # --runInBand is load-bearing, not a tidiness choice. Run in parallel,
      # the timing assertion in src/auth/password-policy.spec.ts
      # ("DUMMY_PASSWORD_HASH costs roughly as much as comparing against a
      # real hash") fails under CPU contention from the other workers -- it
      # passes in isolation and fails in a loaded full-suite run. Since this
      # job gates production deploys, that would make deploys randomly red.
      # Serialised it is reliable: 868/868. Fix the test before removing this.
      - name: Test
        working-directory: backend
        # app-boots.spec.ts compiles the real DI graph, so PrismaService is
        # constructed -- and PrismaClient REJECTS `url: undefined` in its
        # constructor, before any connection is attempted. Locally
        # backend/.env supplies this; .env is gitignored, so CI has nothing and
        # that one spec failed while the other 867 passed.
        #
        # These are deliberately throwaway values. Nothing in the suite opens a
        # socket: compile() wires providers, it does not connect them. The JWT
        # secrets are present so a future provider that reads one at
        # construction does not reintroduce this failure.
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          JWT_ACCESS_SECRET: ci-access-secret-not-used-for-anything-real-0123456789
          JWT_REFRESH_SECRET: ci-refresh-secret-not-used-for-anything-real-9876543210
          # The platform console's strategies read these AT CONSTRUCTION and
          # throw if either is missing, which is exactly the failure mode the
          # note above describes -- so app-boots.spec.ts needs them present.
          # Distinct values: the environment check treats a platform secret
          # that matches a tenant secret as fatal.
          JWT_PLATFORM_ACCESS_SECRET: ci-platform-access-secret-not-real-abcdefghij
          JWT_PLATFORM_REFRESH_SECRET: ci-platform-refresh-secret-not-real-klmnopqrst
        run: npx jest --ci --runInBand

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # `next build` does not fail on type errors in every configuration, so
      # the typecheck is run explicitly as its own gate.
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Matches what production actually ships, so this build exercises
          # the same value. The artifact itself is discarded.
          NEXT_PUBLIC_API_URL: /api
        run: npm run build
