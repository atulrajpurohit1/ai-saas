        <rect x="86" y="106" width="16" height="48" rx="3"/>
        <rect x="110" y="90" width="16" height="64" rx="3"/>
      </g>
      <path d="M64 104 L 94 84 L 118 66" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M104 56 L 136 52 L 130 84 Z" fill="#ffffff"/>
