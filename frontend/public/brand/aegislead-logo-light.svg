<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" role="img" aria-labelledby="aegisleadLogoTitle">
  <title id="aegisleadLogoTitle">AegisLead — Find Leads. Engage. Convert. Grow.</title>
  <!-- Icon mark: official AegisLead artwork, embedded so the lockup is a
       single self-contained asset -->
  <image x="8" y="4" width="180" height="180" href="data:image/png;base64," preserveAspectRatio="xMidYMid meet"/>

  <!-- Wordmark -->
  <text x="196" y="112" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="76" letter-spacing="-1">
    <tspan fill="#111111">Aegis</tspan><tspan fill="#e0221f">Lead</tspan>
  </text>

  <!-- Tagline: textLength pins the run to the wordmark width so it can never
       clip, whichever fallback font the browser resolves. -->
  <text x="198" y="150" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17.5"
        letter-spacing="1.6" textLength="374" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#111111">FIND LEADS.</tspan>
    <tspan fill="#9ca3af"> | </tspan>
    <tspan fill="#111111">ENGAGE.</tspan>
    <tspan fill="#9ca3af"> | </tspan>
    <tspan fill="#e0221f">CONVERT.</tspan>
    <tspan fill="#9ca3af"> | </tspan>
    <tspan fill="#111111">GROW.</tspan>
  </text>
</svg>
