    <tspan fill="#9ca3af"> | </tspan>
    <tspan fill="#111111">ENGAGE.</tspan>
    <tspan fill="#9ca3af"> | </tspan>
    <tspan fill="#e0221f">CONVERT.</tspan>
    <tspan fill="#9ca3af"> | </tspan>
    <tspan fill="#111111">GROW.</tspan>
