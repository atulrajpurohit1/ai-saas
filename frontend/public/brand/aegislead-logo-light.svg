      <stop offset="0%" stop-color="#f4433a"/>
      <stop offset="55%" stop-color="#e0221f"/>
      <stop offset="100%" stop-color="#8f1210"/>
    </linearGradient>
  </defs>

  <!-- Icon mark -->
  <g transform="translate(8, 4) scale(0.9)">
    <path d="M100 18 L179 168 C 158 179, 132 172, 118 152 L100 118 L82 152 C 68 172, 42 179, 21 168 Z" fill="url(#aegisTriGradLight)"/>
    <path d="M100 18 L179 168 C 158 179, 132 172, 118 152 L100 118 Z" fill="#000000" opacity="0.18"/>
    <path d="M21 168 C 30 176, 42 181, 53 179 C 45 190, 30 190, 21 168 Z" fill="#3a0705"/>
    <path d="M179 168 C 170 176, 158 181, 147 179 C 155 190, 170 190, 179 168 Z" fill="#3a0705"/>
    <g transform="translate(36, 30) scale(0.66)">
      <g fill="#ffffff">
