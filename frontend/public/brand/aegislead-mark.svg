<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="aegisleadMarkTitle">
  <title id="aegisleadMarkTitle">AegisLead</title>
  <defs>
    <linearGradient id="aegisTriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4433a"/>
      <stop offset="55%" stop-color="#e0221f"/>
      <stop offset="100%" stop-color="#8f1210"/>
    </linearGradient>
  </defs>

  <!-- Shield/mountain body: red gradient face, darker shadow on the right flank -->
  <path d="M100 18 L179 168 C 158 179, 132 172, 118 152 L100 118 L82 152 C 68 172, 42 179, 21 168 Z" fill="url(#aegisTriGrad)"/>
  <path d="M100 18 L179 168 C 158 179, 132 172, 118 152 L100 118 Z" fill="#000000" opacity="0.18"/>

  <!-- Drip/tail accents at the base, matching the mark's dark points -->
  <path d="M21 168 C 30 176, 42 181, 53 179 C 45 190, 30 190, 21 168 Z" fill="#3a0705"/>
  <path d="M179 168 C 170 176, 158 181, 147 179 C 155 190, 170 190, 179 168 Z" fill="#3a0705"/>

  <!-- Bar chart -->
  <rect x="70" y="118" width="14" height="34" rx="2" fill="#ffffff"/>
  <rect x="93" y="100" width="14" height="52" rx="2" fill="#ffffff"/>
  <rect x="116" y="84" width="14" height="68" rx="2" fill="#ffffff"/>

  <!-- Upward growth arrow sweeping across the bars -->
  <path d="M55 138 C 78 150, 108 150, 132 118 L 150 92" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <path d="M132 84 L 154 88 L 148 110 Z" fill="#ffffff"/>
</svg>
